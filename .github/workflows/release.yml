name: Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Compile
      run: npm run compile
    
    - name: Install vsce
      run: npm install -g vsce
    
    - name: Package Extension
      run: vsce package
    
    - name: Get package info
      id: package
      run: |
        echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
        echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: "*.vsix"
        name: "Release v${{ steps.package.outputs.version }}"
        body: |
          ## Changes in v${{ steps.package.outputs.version }}
          
          Download the `.vsix` file and install it in VS Code:
          1. Open VS Code
          2. Go to Extensions (Ctrl+Shift+X)
          3. Click "..." menu
          4. Select "Install from VSIX..."
          5. Choose the downloaded file
          
          ## Installation
          ```bash
          # Download the .vsix file and install via command line
          code --install-extension ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.vsix
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}